name: Build debug APK

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with commit hash
        id: apk
        run: |
          mkdir -p dist
          src="app/build/outputs/apk/debug/app-debug.apk"
          out="dist/video-cutter-${{ steps.vars.outputs.sha_short }}-debug.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$out")" >> "$GITHUB_OUTPUT"

      - name: Create release with APK asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.vars.outputs.sha_short }}
          name: "Video Cutter build ${{ steps.vars.outputs.sha_short }}"
          body: |
            Automatisch gebauter Debug-APK für Commit ${{ github.sha }} (Branch `${{ github.ref_name }}`).

            Datei: `${{ steps.apk.outputs.name }}`
          files: ${{ steps.apk.outputs.path }}
